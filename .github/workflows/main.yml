name: "⚡ Tailscale Interactive & Unified Service"

on:
  workflow_dispatch:
    inputs:
      PIN:
        description: "CRD PIN (6+ digits). Default 123456"
        required: false
        default: "123456"
      RETRIES:
        description: "Retries for start-host (default 3)"
        required: false
        default: "3"

permissions:
  contents: read

concurrency:
  group: tailscale-service-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  service-runner:
    name: "🪄 Tailscale & Tools Environment"
    runs-on: windows-2022

    env:
      PIN_INPUT:             ${{ github.event.inputs.PIN }}
      RETRIES_INPUT:         ${{ github.event.inputs.RETRIES }}
      BRANCH:                ${{ github.ref_name }}
      RUNNER_ENV:            "hosted"
      EnigMano_Access_Token: ${{ secrets.EnigMano_Access_Token }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: "🔑 Initialize Interactive Tailscale"
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "[INIT] Downloading Tailscale setup package..."
          $netUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.92.3-amd64.msi"
          $targetPath = "$env:TEMP\net_setup.msi"
          Invoke-WebRequest -Uri $netUrl -OutFile $targetPath -UseBasicParsing
          
          Write-Host "[INIT] Installing Tailscale silently..."
          Start-Process msiexec.exe -ArgumentList "/i", "`"$targetPath`"", "/quiet", "/norestart" -Wait
          
          $tailscaleExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          
          Write-Host "=================================================="
          Write-Host "🔗 Starting Tailscale Interactive Login..."
          Write-Host "👉 Please check the logs below for the Login URL link, click it and authenticate."
          Write-Host "=================================================="
          
          # اجرای دستور لاگین به صورت تعاملی برای تولید لینک ورود
          & $tailscaleExe up --login-server=https://controlplane.tailscale.com

          $nodeIP = & $tailscaleExe ip -4
          Write-Host "[OK] Tailscale Connected! Node IP: $nodeIP"
          echo "NODE_IP=$nodeIP" | Out-File -Append $env:GITHUB_ENV

      - name: "🔧 Environment Summary & Preload Assets"
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          if ($env:PIN_INPUT) { Write-Host "::add-mask::$($env:PIN_INPUT)" }

          if (-not $env:EnigMano_Access_Token) {
            Write-Error "❌ Missing required repository secret: EnigMano_Access_Token"
            exit 1
          }
          Write-Host "::add-mask::$($env:EnigMano_Access_Token)"

          try {
            $userDownloads = Join-Path $env:USERPROFILE 'Downloads'
            if (-not (Test-Path $userDownloads)) { New-Item -ItemType Directory -Path $userDownloads | Out-Null }

            $retries = 3
            if ($env:RETRIES_INPUT) { try { $retries = [int]$env:RETRIES_INPUT } catch {} }
            $dlAttempts = [Math]::Max(3, $retries)

            $assets = @(
              @{ Url = "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi"; Name = "crdhost.msi" },
              @{ Url = "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip"; Name = "VBCABLE.zip" },
              @{ Url = "https://code.visualstudio.com/sha/download?build=stable&os=win32-x64-user"; Name = "VisualStudio.exe" },
              @{ Url = "https://nodejs.org/dist/v24.11.0/node-v24.11.0-x64.msi"; Name = "node-v24.msi" }
            )

            function Download-Quiet([string]$Url,[string]$OutFile,[int]$Attempts) {
              for ($i=1; $i -le $Attempts; $i++) {
                try {
                  Invoke-WebRequest -Uri $Url -OutFile $OutFile -UseBasicParsing -TimeoutSec 120
                  if ((Test-Path -LiteralPath $OutFile) -and ((Get-Item $OutFile).Length -gt 0)) { return }
                  throw "Downloaded file missing or zero-size."
                } catch {
                  if ($i -eq $Attempts) { throw }
                  Start-Sleep -Seconds ([int][Math]::Min(20, ($i * 2)))
                }
              }
            }

            foreach ($a in $assets) {
              $dest = Join-Path $userDownloads $a.Name
              Download-Quiet -Url $a.Url -OutFile $dest -Attempts $dlAttempts
            }
          } catch {
            Write-Error "❌ Preload failed: $($_.Exception.Message)"
          }

      - name: "🌟 Deploy EnigMano Instance (Without Headless Code)"
        id: setup
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          try {
            $url = "https://gitlab.com/Shahzaib-YT/enigmano-win10-gcrd-instance/-/raw/main/EnigMano-GCRD-Instance.ps1"
            Invoke-WebRequest -Uri $url -OutFile "EnigMano-GCRD-Instance.ps1" -UseBasicParsing -TimeoutSec 120

            if (-not (Test-Path -LiteralPath "./EnigMano-GCRD-Instance.ps1")) {
              throw "Failed to download EnigMano-GCRD-Instance.ps1"
            }

            powershell.exe -ExecutionPolicy Bypass -File ".\EnigMano-GCRD-Instance.ps1" `
              -Code       ("NO_CODE_REQUIRED") `
              -Pin        ($env:PIN_INPUT) `
              -Retries    ($env:RETRIES_INPUT) `
              -GateSecret ($env:EnigMano_Access_Token)
          } catch {
            Write-Error "⚠️ Execution error: $($_.Exception.Message)"
            exit 1
          }

      - name: "Maintain Service Availability"
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddDays(3)
          Write-Host "----------------------------------------"
          Write-Host "DAEMON OPERATIONAL"
          Write-Host "Tailscale IP: $env:NODE_IP"
          Write-Host "----------------------------------------"
          
          while ((Get-Date) -lt $deadline) {
              $jitter = Get-Random -Minimum 210 -Maximum 330
              Write-Host "Heartbeat OK | Delay: ${jitter}s | $(Get-Date)"
              Start-Sleep -Seconds $jitter
          }
