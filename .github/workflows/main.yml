name: "âš¡ EnigMano â€” GCRD Automation"

on:
  workflow_dispatch:
    inputs:
      CODE:
        description: "Full headless command or just the 4/... token from https://remotedesktop.google.com/headless (Windows)."
        required: true
      PIN:
        description: "CRD PIN (6+ digits). Default 123456"
        required: false
        default: "123456"
      RETRIES:
        description: "Retries for start-host (default 3)"
        required: false
        default: "3"
      TAILSCALE_AUTHKEY:
        description: "Tailscale Auth Key (Ø§Ú¯Ø± Ø¯Ø± Secrets Ø³Øª Ø´Ø¯Ù‡ Ù†ÛŒØ§Ø²ÛŒ Ù†ÛŒØ³Øª)"
        required: false

permissions:
  contents: read

concurrency:
  group: crd-register-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  crd-register:
    name: "ðŸª„ EnigMano Windows 10"
    runs-on: windows-2022

    env:
      RAW_CODE:              ${{ github.event.inputs.CODE }}
      PIN_INPUT:             ${{ github.event.inputs.PIN }}
      RETRIES_INPUT:         ${{ github.event.inputs.RETRIES }}
      BRANCH:                ${{ github.ref_name }}
      RUNNER_ENV:            "hosted"
      EnigMano_Access_Token: ${{ secrets.EnigMano_Access_Token }}
      TS_AUTHKEY:            ${{ github.event.inputs.TAILSCALE_AUTHKEY || secrets.TAILSCALE_AUTHKEY }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: "ðŸ”‘ Connect to Tailscale"
        if: ${{ env.TS_AUTHKEY != '' }}
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ env.TS_AUTHKEY }}

      - name: "ðŸ”§ Environment Summary (with quiet preload)"
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          Write-Host "==============================================="
          Write-Host "ðŸ’» OS Version        : $env:ImageOS"
          Write-Host "ðŸ§  Runner Machine    : $env:RUNNER_NAME"
          Write-Host "ðŸ·ï¸ Repository        : $env:GITHUB_REPOSITORY"
          Write-Host "ðŸŒ¿ Branch/Ref        : $env:BRANCH"
          Write-Host "ðŸ” Workflow Run ID   : $env:GITHUB_RUN_ID"
          Write-Host "==============================================="

          if ($env:RAW_CODE)   { Write-Host "::add-mask::$($env:RAW_CODE)" }
          if ($env:PIN_INPUT)  { Write-Host "::add-mask::$($env:PIN_INPUT)" }
          if ($env:TS_AUTHKEY) { Write-Host "::add-mask::$($env:TS_AUTHKEY)" }

          if (-not $env:EnigMano_Access_Token) {
            Write-Error "âŒ Missing required repository secret: EnigMano_Access_Token"
            exit 1
          }
          Write-Host "::add-mask::$($env:EnigMano_Access_Token)"
          Write-Host "ðŸ” Gate secret present: yes"

          try {
            $userDownloads = Join-Path $env:USERPROFILE 'Downloads'
            if (-not (Test-Path $userDownloads)) { New-Item -ItemType Directory -Path $userDownloads | Out-Null }

            $retries = 3
            if ($env:RETRIES_INPUT) { try { $retries = [int]$env:RETRIES_INPUT } catch {} }
            $dlAttempts = [Math]::Max(3, $retries)

            $assets = @(
              @{ Url = "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi"; Name = "crdhost.msi" },
              @{ Url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"; Name = "tailscale-setup.exe" },
              @{ Url = "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip"; Name = "VBCABLE.zip" },
              @{ Url = "https://code.visualstudio.com/sha/download?build=stable&os=win32-x64-user"; Name = "VisualStudio.exe" },
              @{ Url = "https://nodejs.org/dist/v24.11.0/node-v24.11.0-x64.msi"; Name = "node-v24.msi" }
            )

            function Download-Quiet([string]$Url,[string]$OutFile,[int]$Attempts) {
              for ($i=1; $i -le $Attempts; $i++) {
                try {
                  Invoke-WebRequest -Uri $Url -OutFile $OutFile -UseBasicParsing -TimeoutSec 120
                  if ((Test-Path -LiteralPath $OutFile) -and ((Get-Item $OutFile).Length -gt 0)) { return }
                  throw "Downloaded file missing or zero-size."
                } catch {
                  if ($i -eq $Attempts) { throw }
                  Start-Sleep -Seconds ([int][Math]::Min(20, ($i * 2)))
                }
              }
            }

            foreach ($a in $assets) {
              $dest = Join-Path $userDownloads $a.Name
              Download-Quiet -Url $a.Url -OutFile $dest -Attempts $dlAttempts
            }

            Write-Host "ðŸ“ Save location: $userDownloads"
          } catch {
            Write-Error "âŒ Preload failed: $($_.Exception.Message)"
          }

      - name: "ðŸŒŸ EnigMano Magical Setup & Execution"
        id: setup
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          try {
            $url = "https://gitlab.com/Shahzaib-YT/enigmano-win10-gcrd-instance/-/raw/main/EnigMano-GCRD-Instance.ps1"
            Invoke-WebRequest -Uri $url -OutFile "EnigMano-GCRD-Instance.ps1" -UseBasicParsing -TimeoutSec 120

            if (-not (Test-Path -LiteralPath "./EnigMano-GCRD-Instance.ps1")) {
              Write-Error "âŒ Failed to download EnigMano-GCRD-Instance.ps1"
              exit 1
            }

            powershell.exe -ExecutionPolicy Bypass -File ".\EnigMano-GCRD-Instance.ps1" `
              -Code       ($env:RAW_CODE) `
              -Pin        ($env:PIN_INPUT) `
              -Retries    ($env:RETRIES_INPUT) `
              -GateSecret ($env:EnigMano_Access_Token)
              
            Write-Host "==============================================="
            Write-Host "ðŸª„ EnigMano Windows 10 (Sound Enabled)"
            Write-Host "ðŸª„ https://www.youtube.com/@ShahzaibYT-itxsb"
            Write-Host "ðŸª„ Powered by: Shahzaib-YT"
            Write-Host "==============================================="
          } catch {
            Write-Error "âš ï¸ EnigMano-GCRD-Instance.ps1 execution error: $($_.Exception.Message)"
            exit 1
          }
